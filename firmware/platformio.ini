; SAFEHAVEN Module 3 — wearable firmware
;
; Two environments build the SAME sources in include/core/:
;   env:native      host binary, no hardware, used for algorithm tests
;   env:m5sticks3   the real device
;
; Nothing in include/core/ may include a platform header. That is what keeps
; both environments honest (MODULE_3_IMPLEMENTATION_PLAN.md §26).
;
; ⚠️ BOARD ID: no PlatformIO board definition exists for the M5StickS3.
;    env:m5sticks3 follows M5Stack's own published config
;    (docs.m5stack.com/en/core/StickS3, checked 2026-10-02): the generic
;    `esp32-s3-devkitc-1` plus ESP32-S3-PICO-1-N8R8 memory — 8 MB flash and
;    8 MB OCTAL PSRAM (qio_opi; a wrong PSRAM mode boot-loops the board).
;    M5Unified auto-detects the StickS3 at runtime and owns the display,
;    BMI270, buttons and power pins.

[platformio]
default_envs = native

; ── shared ──────────────────────────────────────────────────────────────────
[env]
build_flags = -std=gnu++17 -Iinclude
build_unflags = -std=gnu++11

; ── host build: algorithms only, no hardware ────────────────────────────────
; For day-to-day work prefer the plain Makefile in native/ — it needs nothing
; but a C++ compiler. This env exists so CI can build everything with one tool.
[env:native]
platform = native
build_flags = -std=c++17 -Iinclude -Inative -Wall -Wextra
build_src_filter = +<../native/test_detection.cpp>

; ── Wokwi simulator: generic ESP32-S3 DevKitC-1, NOT the M5StickS3 ──────────
; Build: pio run -e wokwi   → .pio/build/wokwi/firmware.{bin,elf}, which is
; exactly what wokwi.toml points at. Differs from env:m5sticks3 on purpose:
; no ARDUINO_USB_CDC_ON_BOOT, so Serial goes to UART0 — the pins diagram.json
; wires to Wokwi's serial monitor. The real StickS3 prints over native USB.
[env:wokwi]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_src_filter = +<main.cpp>
lib_deps =
    adafruit/Adafruit ILI9341 @ ^1.6.1   ; screen stand-in; pulls in Adafruit GFX
    adafruit/Adafruit MPU6050 @ ^2.2.9   ; Wokwi's only IMU part — NOT the StickS3's BMI270

; ── real M5StickS3: hardware bring-up (Stage 7) ─────────────────────────────
; Build + flash: pio run -e m5sticks3 -t upload   Monitor: pio device monitor -e m5sticks3
; Serial is the S3's native USB (CDC on boot), not a UART.
[env:m5sticks3]
platform = espressif32
board = esp32-s3-devkitc-1      ; generic S3, 8 MB flash — see header note
framework = arduino
monitor_speed = 115200
board_build.partitions = default_8MB.csv
board_build.arduino.memory_type = qio_opi   ; octal PSRAM — per M5Stack's config
build_src_filter = +<sticks3_main.cpp>

; M5Stack's config also sets -mfix-esp32-psram-cache-issue (a workaround for
; the ORIGINAL ESP32, not the S3) and CORE_DEBUG_LEVEL=5 (verbose logs); both
; are left out. Their M5PM1 library is not needed: M5Unified drives the PMIC.
build_flags =
    -std=gnu++17
    -Iinclude
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
; This is the deployable build: no bench tools, and the backend link is
; https only (plain http is refused). For bench work use env:m5sticks3-bench.
;
; Secure credential storage (§9) is NOT switched on by any setting here: the
; Arduino framework ships a prebuilt bootloader without flash encryption.
; Production bands are encrypted with the procedure in firmware/SECURITY.md
; (it burns eFuses, permanently), never the development band.

lib_deps =
    m5stack/M5Unified @ ^0.2.24   ; StickS3 display/BMI270/buttons/power; pulls in M5GFX
    bblanchon/ArduinoJson @ ^7.4.2 ; parse /device-api responses (src/DeviceLink.h)
    ; A QR renderer joins at Stage 10. Firmware dependencies are separate from
    ; the "no new dependencies" rule, which governs the Python/JS repo (D6).

; Bench / development build: everything in env:m5sticks3 plus the serial test
; tools (inject, rec, noise, shot), plain-http backends on a trusted LAN, and
; Talk to SafeHaven (microphone on).
; Never flash this to a band that goes to a patient.
[env:m5sticks3-bench]
extends = env:m5sticks3
build_flags =
    ${env:m5sticks3.build_flags}
    -DSH_BENCH_TOOLS
    -DSH_ALLOW_HTTP
    ; "Talk to SafeHaven": turns the microphone on for push-to-talk. Bench
    ; only until the hospital approves a microphone on the ward.
    -DSH_TALK

; Low-power experiment: env:m5sticks3-bench built with ESP-IDF power
; management, so the S3 light-sleeps between 50 Hz IMU samples while Wi-Fi
; stays associated (modem sleep). The prebuilt Arduino SDK has PM switched
; off, so this env builds Arduino 2.0.17 as a component of the ESP-IDF it was
; made from (4.4.7). IDF settings: sdkconfig.lowpower.defaults; project files:
; CMakeLists.txt + src/CMakeLists.txt (only this env reads them).
; NOT yet verified on a band — bench only.
[env:m5sticks3-lowpower]
extends = env:m5sticks3-bench
framework = arduino, espidf
platform_packages =
    platformio/framework-espidf @ ~3.40407.0
board_build.partitions = partitions_default_8MB.csv
build_flags =
    ${env:m5sticks3-bench.build_flags}
    -DSH_LOW_POWER
