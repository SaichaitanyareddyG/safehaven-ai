; SAFEHAVEN Module 3 — wearable firmware
;
; Two environments build the SAME sources in include/core/:
;   env:native      host binary, no hardware, used for algorithm tests
;   env:m5sticks3   the real device
;
; Nothing in include/core/ may include a platform header. That is what keeps
; both environments honest (MODULE_3_IMPLEMENTATION_PLAN.md §26).
;
; ⚠️ STAGE 0 STATUS: only the native path is exercised today. The device
;    environment below is scaffolding and has NOT been built or flashed — it is
;    Stage 7 work, and it is written down now only so the layout is settled.
;
; ⚠️ BOARD ID IS UNVERIFIED. The M5StickS3 is a recent product and may not yet
;    have a PlatformIO board definition. `esp32-s3-devkitc-1` is used as the
;    closest generic ESP32-S3-N8R8 match. Before Stage 7, check whether
;    platform-espressif32 ships an `m5stack-sticks3` board and switch to it if
;    so; otherwise verify flash/PSRAM size, display pins and I2C pins against
;    docs.m5stack.com/en/core/StickS3 by hand.

[platformio]
default_envs = native

; ── shared ──────────────────────────────────────────────────────────────────
[env]
build_flags = -std=gnu++17 -Iinclude
build_unflags = -std=gnu++11

; ── host build: algorithms only, no hardware ────────────────────────────────
; For day-to-day work prefer the plain Makefile in native/ — it needs nothing
; but a C++ compiler. This env exists so CI can build everything with one tool.
[env:native]
platform = native
build_flags = -std=c++17 -Iinclude -Inative -Wall -Wextra
build_src_filter = +<../native/test_detection.cpp>

; ── device build (Stage 7, not yet exercised) ───────────────────────────────
[env:m5sticks3]
platform = espressif32
board = esp32-s3-devkitc-1      ; UNVERIFIED — see header note
framework = arduino
monitor_speed = 115200
board_build.mcu = esp32s3
board_build.partitions = default_8MB.csv

build_flags =
    -std=gnu++17
    -Iinclude
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM

; Secure credential storage (§9). NVS encryption depends on flash encryption,
; which must be enabled deliberately — leaving these commented means the device
; secret sits in plaintext flash, which is acceptable ONLY for bench work.
; Enable before anything resembling a real deployment:
;   board_build.flash_encryption = true
;   board_build.secure_boot = true

lib_deps =
    ; Added in Stage 7. Expected: M5Unified (display/IMU/power) and a QR
    ; renderer. Firmware dependencies are separate from the "no new
    ; dependencies" rule, which governs the Python/JS repo (decision D6).
