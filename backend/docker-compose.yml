services:
  postgres:
    image: postgres:16-alpine
    container_name: safehaven-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: safehaven
      POSTGRES_PASSWORD: safehaven
      POSTGRES_DB: safehaven
    ports:
      - "5432:5432"
    volumes:
      - safehaven_pg_data:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safehaven"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  safehaven_pg_data:
